<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>Chance Faurot</title>

  <body>
    <div class="topnav">
      <a class="active" href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </div>

    <div class="innerbody">
      <h1>Welcome to JavaScript!</h1>

      <h4>Quote of the Day</h4>
      <div id="quoteContainer"></div>
      <!-- <div class="module-output" id="output"></div> -->

      <form id="userForm" novalidate>
        <label> Student Name: <input id="studentName" /> </label>

        <label>
          Completed Modules:
          <input id="completedModules" type="number" min="0" max="10" />
        </label>

        <label>
          Study Day:
          <select id="studyDay">
            <option>Monday</option>
            <option>Tuesday</option>
            <option>Wednesday</option>
            <option>Thursday</option>
            <option>Friday</option>
            <option>Saturday</option>
            <option>Sunday</option>
          </select>
        </label>

        <label>
          Career Path:
          <select id="career">
            <option value="" selected disabled>Select a career path</option>
            <option>Software Developer</option>
            <option>Web Developer</option>
            <option>Game Developer</option>
          </select>
        </label>

        <button id="generateButton" type="submit">Generate</button>
        <button id="resetButton" type="reset">Reset</button>
      </form>

      <div id="output"></div>
    </div>

    <footer>
      <div class="footer">
        <div class="row">
